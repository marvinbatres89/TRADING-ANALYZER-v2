<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prueba de conexión con Deriv</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101820;
      color: white;
    }

    .contenedor {
      width: 100%;
      max-width: 430px;
      padding: 25px;
      text-align: center;
      background: #1d2935;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    .estado {
      margin: 20px 0;
      padding: 14px;
      font-weight: bold;
      background: #263747;
      border-radius: 10px;
    }

    .precio {
      margin: 18px 0;
      font-size: 38px;
      font-weight: bold;
      color: #40e0a1;
    }

    .detalle {
      margin: 10px 0;
      color: #c9d4dd;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      background: #1683ff;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .error {
      color: #ff7070;
    }

    .conectado {
      color: #40e0a1;
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <h1>Prueba de conexión con Deriv</h1>

    <p>
      Índice:
      <strong>Volatility 100 (1s)</strong>
    </p>

    <div id="estado" class="estado">
      Preparando conexión...
    </div>

    <div id="precio" class="precio">
      --.--
    </div>

    <p class="detalle">
      Última actualización:
      <span id="hora">--:--:--</span>
    </p>

    <p class="detalle">
      Ticks recibidos:
      <span id="contador">0</span>
    </p>

    <button id="reconectar">
      Reconectar
    </button>

  </main>

  <script>
    const estado = document.getElementById("estado");
    const precio = document.getElementById("precio");
    const hora = document.getElementById("hora");
    const contador = document.getElementById("contador");
    const botonReconectar = document.getElementById("reconectar");

    let socket;
    let totalTicks = 0;

    function mostrarEstado(mensaje, clase = "") {
      estado.textContent = mensaje;
      estado.className = "estado";

      if (clase) {
        estado.classList.add(clase);
      }
    }

    function conectarDeriv() {
      if (
        socket &&
        (
          socket.readyState === WebSocket.OPEN ||
          socket.readyState === WebSocket.CONNECTING
        )
      ) {
        socket.close();
      }

      totalTicks = 0;
      contador.textContent = "0";
      precio.textContent = "--.--";

      mostrarEstado("Conectando con Deriv...");

      socket = new WebSocket(
        "wss://ws.derivws.com/websockets/v3?app_id=1089"
      );

      socket.onopen = function () {
        mostrarEstado(
          "Conectado. Recibiendo precios...",
          "conectado"
        );

        socket.send(
          JSON.stringify({
            ticks: "1HZ100V",
            subscribe: 1
          })
        );
      };

      socket.onmessage = function (evento) {
        const datos = JSON.parse(evento.data);

        if (datos.error) {
          mostrarEstado(
            "Error: " + datos.error.message,
            "error"
          );

          console.error(datos.error);
          return;
        }

        if (datos.tick) {
          totalTicks++;

          precio.textContent = Number(
            datos.tick.quote
          ).toFixed(2);

          contador.textContent = totalTicks;

          hora.textContent =
            new Date().toLocaleTimeString("es-SV");
        }
      };

      socket.onerror = function (error) {
        mostrarEstado(
          "No se pudo conectar con Deriv.",
          "error"
        );

        console.error("Error de WebSocket:", error);
      };

      socket.onclose = function () {
        mostrarEstado(
          "Conexión cerrada. Pulsa Reconectar.",
          "error"
        );
      };
    }

    botonReconectar.addEventListener(
      "click",
      conectarDeriv
    );

    conectarDeriv();
  </script>

</body>
</html>
