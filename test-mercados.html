<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba de Mercados</title>

<style>

body{
background:#111827;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.card{
background:#1f2937;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
}

#salida{
background:#000;
color:#00ff88;
padding:10px;
border-radius:10px;
height:320px;
overflow:auto;
white-space:pre-wrap;
font-size:13px;
}

</style>

</head>

<body>

<h1>Trading Analyzer V2</h1>

<div class="card">

<button id="btnConectar">

Conectar

</button>

<button id="btnMercados">

Solicitar Mercados

</button>

</div>

<div id="salida">

Esperando...

</div>

<script type="module">

import { conexionDeriv } from "./conexion.js";
import { mercadosDeriv } from "./mercados.js";

const salida =
document.getElementById("salida");

const btnConectar =
document.getElementById("btnConectar");

const btnMercados =
document.getElementById("btnMercados");

function escribir(texto){

salida.textContent +=
"\n" + texto;

salida.scrollTop =
salida.scrollHeight;

}

window.addEventListener(
"deriv:diagnostico",
(evento)=>{

const dato = evento.detail;

escribir(
"[" +
dato.hora +
"] " +
dato.mensaje
);

});

conexionDeriv.alCambiarEstado((estado)=>{

escribir(
"Estado: " +
estado.estado
);

});

mercadosDeriv.alActualizar((datos)=>{

escribir("");

escribir(
"===== MERCADOS ENCONTRADOS ====="
);

datos.volatility.forEach((mercado)=>{

escribir(
mercado.nombre +
" -> " +
mercado.codigo
);

});

escribir("");

escribir(
"Total encontrados: " +
datos.volatility.length
);

});

btnConectar.addEventListener(
"click",
()=>{

escribir(
"Iniciando conexión..."
);

conexionDeriv.conectar();

});

btnMercados.addEventListener(
"click",
()=>{

escribir(
"Solicitando mercados..."
);

mercadosDeriv.solicitarMercados();

});

 </script>

</body>
</html>
