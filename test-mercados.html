<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prueba de mercados</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 20px;
      background: #101827;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      margin: 20px 0 35px;
      font-size: 38px;
      text-align: center;
    }

    .controles {
      padding: 28px;
      border-radius: 20px;
      background: #1d2939;
    }

    button {
      width: 100%;
      margin: 10px 0;
      padding: 22px 15px;
      border: none;
      border-radius: 16px;
      background: #2563eb;
      color: #ffffff;
      font-size: 25px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #salida {
      width: 100%;
      min-height: 520px;
      margin-top: 28px;
      padding: 20px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      border-radius: 18px;
      background: #000000;
      color: #22e584;
      font-family: monospace;
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <h1>Trading Analyzer V2</h1>

    <section class="controles">
      <button id="btnConectar" type="button">
        Conectar
      </button>

      <button id="btnMercados" type="button">
        Solicitar Mercados
      </button>
    </section>

    <pre id="salida">Página cargada correctamente.</pre>
  </main>

  <script type="module">
    import {
      conexionDeriv
    } from "./conexion.js";

    import {
      mercadosDeriv
    } from "./mercados.js";

    const salida =
      document.getElementById("salida");

    const btnConectar =
      document.getElementById("btnConectar");

    const btnMercados =
      document.getElementById("btnMercados");

    function escribir(texto) {
      salida.textContent +=
        "\n" + String(texto);

      salida.scrollTop =
        salida.scrollHeight;
    }

    escribir("JavaScript iniciado.");
    escribir("Módulos importados correctamente.");

    window.addEventListener(
      "deriv:diagnostico",
      function (evento) {
        const dato = evento.detail || {};

        escribir(
          "[" +
          (dato.hora || "--") +
          "] " +
          (dato.mensaje || "Sin mensaje")
        );
      }
    );

    conexionDeriv.alCambiarEstado(
      function (estado) {
        const valor =
          estado &&
          estado.estado
            ? estado.estado
            : String(estado);

        escribir(
          "Estado de conexión: " + valor
        );
      }
    );

    mercadosDeriv.alActualizar(
      function (datos) {
        const mercados =
          datos &&
          Array.isArray(datos.volatility)
            ? datos.volatility
            : [];

        escribir("");
        escribir(
          "===== MERCADOS ENCONTRADOS ====="
        );

        if (mercados.length === 0) {
          escribir(
            "No se encontraron índices Volatility."
          );
        }

        mercados.forEach(
          function (mercado) {
            escribir(
              mercado.nombre +
              " → " +
              mercado.codigo
            );
          }
        );

        escribir(
          "Total encontrados: " +
          mercados.length
        );
      }
    );

    btnConectar.addEventListener(
      "click",
      function () {
        escribir("");
        escribir("Iniciando conexión...");

        try {
          conexionDeriv.conectar();
        } catch (error) {
          escribir(
            "Error al conectar: " +
            error.message
          );
        }
      }
    );

    btnMercados.addEventListener(
      "click",
      function () {
        escribir("");
        escribir("Solicitando mercados...");

        try {
          mercadosDeriv.solicitarMercados();
        } catch (error) {
          escribir(
            "Error al solicitar mercados: " +
            error.message
          );
        }
      }
    );

    window.addEventListener(
      "error",
      function (evento) {
        escribir(
          "ERROR DE JAVASCRIPT: " +
          evento.message
        );
      }
    );

    window.addEventListener(
      "unhandledrejection",
      function (evento) {
        escribir(
          "ERROR NO CONTROLADO: " +
          String(evento.reason)
        );
      }
    );
  </script>
</body>
</html>
