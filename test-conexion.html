<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Conexión - Trading Analyzer V2</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#111827;
      color:white;
      font-family:Arial,sans-serif;
      padding:20px;
    }

    .contenedor{
      max-width:500px;
      margin:auto;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      color:#4ade80;
    }

    .card{
      background:#1f2937;
      border-radius:12px;
      padding:15px;
      margin-bottom:15px;
    }

    .estado{
      font-size:18px;
      font-weight:bold;
      margin-top:10px;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }

    #diagnostico{
      background:#000;
      color:#00ff88;
      padding:10px;
      border-radius:10px;
      height:250px;
      overflow:auto;
      white-space:pre-wrap;
      font-size:13px;
    }
  </style>
</head>

<body>

<div class="contenedor">

<h1>Trading Analyzer V2</h1>

<div class="card">

Estado de conexión

<div
id="estado"
class="estado">

Desconectado

</div>

</div>

<button id="btnConectar">

Conectar con Deriv

</button>

<button id="btnDesconectar">

Desconectar

</button>

<div class="card">

Diagnóstico

<div id="diagnostico">

Esperando...

</div>

</div>
<script type="module">

import { conexionDeriv } from "./conexion.js";

const estado =
document.getElementById("estado");

const diagnostico =
document.getElementById("diagnostico");

const btnConectar =
document.getElementById("btnConectar");

const btnDesconectar =
document.getElementById("btnDesconectar");

function escribir(texto){

diagnostico.textContent +=
"\n" + texto;

diagnostico.scrollTop =
diagnostico.scrollHeight;

}

conexionDeriv.alCambiarEstado((info)=>{

estado.textContent =
info.estado;

escribir(
"Estado: " +
info.estado
);

});

window.addEventListener(
"deriv:diagnostico",
(evento)=>{

const dato = evento.detail;

escribir(
"[" +
dato.hora +
"] " +
dato.mensaje
);

});

btnConectar.addEventListener(
"click",
()=>{

escribir(
"Intentando conectar..."
);

conexionDeriv.conectar();

});

btnDesconectar.addEventListener(
"click",
()=>{

conexionDeriv.desconectar();

escribir(
"Conexión detenida."
);

});
  </script>

</div>

</body>
</html>
