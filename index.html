<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prueba de conexión Deriv</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background: #101722;
    }

    .contenedor {
      width: 100%;
      max-width: 480px;
      margin: 20px auto;
      padding: 22px;
      border: 1px solid #2c3a4d;
      border-radius: 18px;
      background: #182231;
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
      text-align: center;
    }

    .mercado {
      margin-bottom: 15px;
      text-align: center;
      color: #b8c4d3;
    }

    .estado {
      margin: 20px 0;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      background: #263447;
    }

    .precio {
      margin: 20px 0;
      padding: 22px;
      border-radius: 12px;
      text-align: center;
      background: #0f1722;
    }

    .precio small {
      display: block;
      margin-bottom: 8px;
      color: #aeb9c7;
    }

    #precio {
      font-size: 34px;
      font-weight: bold;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #conectarBtn {
      color: #ffffff;
      background: #1769e0;
    }

    #desconectarBtn {
      color: #ffffff;
      background: #a52f3a;
    }

    .registro {
      height: 250px;
      margin-top: 20px;
      padding: 12px;
      overflow-y: auto;
      border-radius: 10px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
      color: #c9d5e4;
      background: #0b111a;
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <h1>Prueba de conexión Deriv</h1>

    <div id="mercado" class="mercado">
      Mercado: buscando símbolo disponible...
    </div>

    <div id="estado" class="estado">
      Esperando conexión...
    </div>

    <div class="precio">
      <small>Precio recibido</small>
      <span id="precio">--</span>
    </div>

    <button id="conectarBtn">
      Conectar con Deriv
    </button>

    <button id="desconectarBtn">
      Desconectar
    </button>

    <div id="registro" class="registro">
      Diagnóstico:
    </div>
  </main>

  <script>
    const estado = document.getElementById("estado");
    const precio = document.getElementById("precio");
    const mercado = document.getElementById("mercado");
    const registro = document.getElementById("registro");
    const conectarBtn = document.getElementById("conectarBtn");
    const desconectarBtn = document.getElementById("desconectarBtn");

    let socket = null;
    let simboloSeleccionado = null;

    function agregarRegistro(mensaje) {
      const hora = new Date().toLocaleTimeString();

      registro.textContent +=
        "\n[" + hora + "] " + mensaje;

      registro.scrollTop = registro.scrollHeight;
    }

    function buscarVolatility100(lista) {
      const coincidencias = lista.filter((item) => {
        const nombre = String(
          item.display_name || item.market_display_name || ""
        ).toLowerCase();

        return (
          nombre.includes("volatility 100") ||
          item.symbol === "R_100" ||
          item.symbol === "1HZ100V"
        );
      });

      const simboloContinuo = coincidencias.find(
        (item) => item.symbol === "R_100"
      );

      return simboloContinuo || coincidencias[0] || null;
    }

    function solicitarSimbolos() {
      agregarRegistro(
        "Solicitando lista de mercados activos..."
      );

      socket.send(
        JSON.stringify({
          active_symbols: "brief",
          product_type: "basic",
          req_id: 1
        })
      );
    }

    function suscribirseAPrecios(simbolo) {
      simboloSeleccionado = simbolo;

      mercado.textContent =
        "Mercado: " +
        simbolo.display_name +
        " (" +
        simbolo.symbol +
        ")";

      agregarRegistro(
        "Símbolo seleccionado: " +
        simbolo.display_name +
        " - " +
        simbolo.symbol
      );

      socket.send(
        JSON.stringify({
          ticks: simbolo.symbol,
          subscribe: 1,
          req_id: 2
        })
      );

      agregarRegistro(
        "Suscripción de precios enviada."
      );
    }

    function conectar() {
      if (
        socket &&
        (
          socket.readyState === WebSocket.OPEN ||
          socket.readyState === WebSocket.CONNECTING
        )
      ) {
        agregarRegistro(
          "Ya existe una conexión activa."
        );
        return;
      }

      estado.textContent = "Conectando...";
      precio.textContent = "--";
      mercado.textContent =
        "Mercado: buscando símbolo disponible...";

      agregarRegistro(
        "Intentando conectar con Deriv..."
      );

      socket = new WebSocket(
        "wss://ws.derivws.com/websockets/v3?app_id=1089"
      );

      socket.onopen = function () {
        estado.textContent = "Conectado";

        agregarRegistro(
          "Conexión WebSocket establecida."
        );

        solicitarSimbolos();
      };

      socket.onmessage = function (evento) {
        let datos;

        try {
          datos = JSON.parse(evento.data);
        } catch (error) {
          agregarRegistro(
            "No se pudo interpretar la respuesta."
          );
          return;
        }

        if (datos.error) {
          estado.textContent = "Error de Deriv";

          agregarRegistro(
            "Error: " + datos.error.message
          );

          return;
        }

        if (
          datos.msg_type === "active_symbols" &&
          Array.isArray(datos.active_symbols)
        ) {
          agregarRegistro(
            "Mercados recibidos: " +
            datos.active_symbols.length
          );

          const encontrado = buscarVolatility100(
            datos.active_symbols
          );

          if (!encontrado) {
            estado.textContent =
              "Volatility 100 no encontrado";

            agregarRegistro(
              "No se encontró Volatility 100 en la lista."
            );

            agregarRegistro(
              "Primeros símbolos disponibles:"
            );

            datos.active_symbols
              .slice(0, 10)
              .forEach((item) => {
                agregarRegistro(
                  item.display_name +
                  " = " +
                  item.symbol
                );
              });

            return;
          }

          suscribirseAPrecios(encontrado);
          return;
        }

        if (datos.tick) {
          precio.textContent = datos.tick.quote;

          estado.textContent =
            "Conectado y recibiendo precios";

          agregarRegistro(
            "Precio recibido: " +
            datos.tick.quote
          );
        }
      };

      socket.onerror = function () {
        estado.textContent = "Error de conexión";

        agregarRegistro(
          "El navegador informó un error WebSocket."
        );
      };

      socket.onclose = function (evento) {
        estado.textContent = "Desconectado";

        agregarRegistro(
          "Conexión cerrada. Código: " +
          evento.code
        );
      };
    }

    function desconectar() {
      if (!socket) {
        agregarRegistro(
          "No existe una conexión para cerrar."
        );
        return;
      }

      socket.close(1000, "Cierre manual");
      socket = null;
      simboloSeleccionado = null;

      estado.textContent = "Desconectado";
      precio.textContent = "--";
      mercado.textContent =
        "Mercado: sin conexión";
    }

    conectarBtn.addEventListener(
      "click",
      conectar
    );

    desconectarBtn.addEventListener(
      "click",
      desconectar
    );

    agregarRegistro(
      "Página de prueba cargada."
    );
  </script>
</body>
</html>
